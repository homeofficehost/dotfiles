    name = rule-117a12af
    match:title = ^(Picture-in-Picture)$
    keep_aspect_ratio = true
}

# DESKTOP MANAGER (pcmanfm desktop mode) - sempre visível atrás de tudo
windowrule {
    name = rule-206fb558
    match:tag = desktop-manager* # sempre visível
    pin = true
}
windowrule {
    name = rule-76cf8f04
    match:tag = desktop-manager* # sem blur para melhor performance
    no_blur = true
}
windowrule {
    name = rule-f5d77b36
    match:tag = desktop-manager* # ligeiramente transparente para mostrar wallpaper
    opacity = 0.95 0.95
}
windowrule {
    name = rule-7ef1845e
    match:tag = desktop-manager* # sem bordas
    border_size = 0
}
windowrule {
    name = rule-55766074
    match:tag = desktop-manager* # sem sombra
    no_shadow = true
}
windowrule {
    name = rule-06d92e5c
    match:tag = desktop-manager* # sem animações
    no_anim = true
}
windowrule {
    name = rule-1960d1f6
    match:tag = desktop-manager* # sem limite de tamanho
    no_max_size = true
}
windowrule {
    name = rule-33850a69
    match:tag = desktop-manager* # tela cheia
    size = 100% 100%
}
windowrule {
    name = rule-3ef1d11b
    match:tag = desktop-manager* # posição 0,0
    move = 0 0
}

# BLUR & FULLSCREEN
windowrule {
    name = rule-df845392
    match:tag = games*
    no_blur = true
}
windowrule {
    name = rule-d15f65d2
    match:tag = games*
    fullscreen = true
}

