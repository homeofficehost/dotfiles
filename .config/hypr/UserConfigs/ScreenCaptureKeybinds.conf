# Screen Capture Keybinds for Hyprland
# Screenshot and Screen Recording hotkeys

# Screenshots - Save to file
bind = SUPER, PRINT, exec, ~/.config/hypr/UserScripts/Screenshot.sh --fullscreen
bind = SUPER SHIFT, PRINT, exec, ~/.config/hypr/UserScripts/Screenshot.sh --region
bind = SUPER ALT, PRINT, exec, ~/.config/hypr/UserScripts/Screenshot.sh --window

# Screenshots - Copy to clipboard
bind = SUPER CTRL, PRINT, exec, ~/.config/hypr/UserScripts/Screenshot.sh --fullscreen-clipboard
bind = SUPER CTRL SHIFT, PRINT, exec, ~/.config/hypr/UserScripts/Screenshot.sh --region-clipboard
bind = SUPER CTRL ALT, PRINT, exec, ~/.config/hypr/UserScripts/Screenshot.sh --window-clipboard

# Screen Recording (based on hyprland-window-keybinds.md)
bind = SUPER, V, exec, ~/.config/hypr/UserScripts/ScreenRecord.sh --region
bind = SUPER SHIFT, V, exec, ~/.config/hypr/UserScripts/ScreenRecord.sh --fullscreen
bind = SUPER CTRL, V, exec, ~/.config/hypr/UserScripts/ScreenRecord.sh --all-monitors
bind = SUPER SHIFT, C, exec, ~/.config/hypr/UserScripts/ScreenRecord.sh --region-audio
bind = SUPER CTRL SHIFT, C, exec, ~/.config/hypr/UserScripts/ScreenRecord.sh --fullscreen-audio
