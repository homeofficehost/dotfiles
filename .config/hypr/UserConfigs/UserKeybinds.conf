# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = ALT
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# settings for User defaults apps - set your default terminal and file manager on this file
source= $UserConfigs/01-UserDefaults.conf

# common shortcuts
bind = $mainMod, $mainMod_L, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window
bind = $mainMod, B, exec, xdg-open "https://"  # default browser
#bind = $mainMod, A, exec, pkill rofi || true && ags -t 'overview' # desktop overview (if installed)
# bind = $mainMod, A, global, quickshell:overviewToggle # desktop overview (if installed - disabled)
bind = $mainMod, Return, exec, $term  #terminal
bind = $mainMod CTRL, Return, exec, $term2  #terminal2
bind = $mainMod, E, exec, $files #file manager


# FEATURES / EXTRAS
bind = $mainMod, H, exec, $scriptsDir/KeyHints.sh # help / cheat sheet
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh # Refresh waybar, swaync, rofi
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh # emoji menu
bind = $mainMod, S, exec, $scriptsDir/RofiSearch.sh # Google search using rofi
bind = $mainMod ALT, O, exec, $scriptsDir/ChangeBlur.sh # Toggle blur settings 
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # Toggle animations ON/OFF
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh # Toggle Master or Dwindle Layout
bind = $mainMod ALT, V, exec, $scriptsDir/ClipManager.sh # Clipboard Manager
bind = $mainMod CTRL, R, exec, $scriptsDir/RofiThemeSelector.sh # KooL Rofi Menu Theme Selector
bind = $mainMod CTRL SHIFT, R, exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh # modified Rofi Theme Selector

bind = $mainMod, F, fullscreen # whole full screen
bind = $mainMod SHIFT, F, fullscreen # whole full screen
bind = $mainMod CTRL, F, fullscreen, 1 # fake full screen
bind = $mainMod, SPACE, togglefloating, #Float Mode
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat #All Float Mode
bind = $mainMod SHIFT, Return, exec, [float; move 15% 5%; size 70% 60%] $term # Dropdown terminal

# Desktop zooming or magnifier
#bind = $mainMod ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
#bind = $mainMod ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

## NOTES for ja (Hyprland version 0.39 (Ubuntu 24.04))
bind = CTRL SHIFT, mouse_down, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bind = CTRL SHIFT, mouse_up, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"
bind = ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.2}')"
bind = ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.2}')"

# Waybar / Bar related
bind = $mainMod CTRL ALT, B, exec, pkill -SIGUSR1 waybar # Toggle hide/show waybar 
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh # Waybar Styles Menu
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh # Waybar Layout Menu

# FEATURES / EXTRAS (UserScripts)
# bind = $mainMod SHIFT, M, exec, $UserScripts/RofiBeats.sh # online music using rofi - CONFLICT: moved to Super+Alt+M
bind = $mainMod ALT, M, exec, $UserScripts/RofiBeats.sh # online music using rofi (moved from Super+Shift+M)
bind = $mainMod, W, exec, $UserScripts/WallpaperSelect.sh # Select wallpaper to apply
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperEffects.sh # Wallpaper Effects by imagemagick
bind = CTRL ALT, W, exec, $UserScripts/WallpaperRandom.sh # Random wallpapers
bind = $mainMod SHIFT, U, exec, $UserScripts/reset-default-wallpaper.sh # Reset to default static wallpaper (kill mpvpaper)
bind = $mainMod, U, exec, $UserScripts/set-video-wallpaper.sh # Switch to video wallpaper mode (direct)
bind = $mainMod CTRL, O, exec, hyprctl setprop active opaque toggle # disable opacity on active window
bind = $mainMod SHIFT, K, exec, $scriptsDir/KeyBinds.sh # search keybinds via rofi
bind = $mainMod SHIFT, A, exec, $scriptsDir/Animations.sh #hyprland animations menu
bind = $mainMod SHIFT, O, exec, $UserScripts/ZshChangeTheme.sh # Change oh-my-zsh theme
bindln = ALT_L, SHIFT_L, exec, $scriptsDir/SwitchKeyboardLayout.sh # Change keyboard layout globally
bindln = SHIFT_L, ALT_L, exec, $scriptsDir/Tak0-Per-Window-Switch.sh # Change keyboard layout locally for each window
bind = $mainMod ALT, C, exec, $UserScripts/RofiCalc.sh # calculator (qalculate)

# Move current focused window to next/previous workspace
bind = $mainMod CTRL SHIFT, left, movetoworkspace, -1  # Move window to previous workspace
bind = $mainMod CTRL SHIFT, right, movetoworkspace, +1  # Move window to next workspace

# Force US International with dead keys
bind = $mainMod CTRL, SPACE, exec, ~/.config/hypr/scripts/SetKeyboardLayout.sh

# Reorganizar workspaces nos monitores corretos
bind = $mainMod SHIFT CTRL, W, exec, ~/.config/hypr/scripts/FixWorkspaces.sh

# Minimizar janela (mover para workspace especial)
bind = $mainMod, M, exec, $UserScripts/ToggleMinimize.sh # Toggle minimize/unminimize window
# bind = $mainMod, F1, exec, $UserScripts/ToggleMinimize.sh # Toggle minimize/unminimize window

# Split ratio control
bind = $mainMod SHIFT, R, exec, hyprctl reload  # Reload Hyprland configuration

# Window/tiling keybinds
# NOTE: Duplicates of ~/.config/hypr/configs/Keybinds.conf were removed to avoid conflicts.
# Monitor navigation (unique)
# NOTE: using Ctrl+Alt to avoid conflict with Ctrl+Shift+Left/Right (move-to-workspace)
bind = $mainMod CTRL ALT, Left, exec, hyprctl dispatch focusmonitor 0
bind = $mainMod CTRL ALT, Right, exec, hyprctl dispatch focusmonitor 1
bind = $mainMod CTRL ALT, Up, exec, hyprctl dispatch focusmonitor 2
bind = $mainMod CTRL ALT, Down, exec, hyprctl dispatch focusmonitor 3
# Workspace special keybinds (complementing default Keybinds.conf)
# Using grave (`) key as primary keybind for special workspace (keycode 49 for US International)
bind = $mainMod, code:49, togglespecialworkspace # Primary: show/hide special workspace using ` (dead_grave)
bind = $mainMod SHIFT, code:49, movetoworkspace, special # Primary: move to special workspace using Shift+`
bind = $mainMod SHIFT, M, movetoworkspace, e+0 # Move window from special back to current workspace


# Desktop icons toggle
bind = $mainMod ALT, D, exec, pkill pcmanfm || pcmanfm --desktop # Toggle desktop icons

# Monitor rotation controls for tablet streaming (Super + Ctrl + T for "Transform")
bind = $mainMod CTRL, T, exec, hyprctl keyword monitor DP-1,2560x1440@165,0x0,1,transform,0 # Normal orientation
bind = $mainMod CTRL SHIFT, T, exec, hyprctl keyword monitor DP-1,2560x1440@165,0x0,1,transform,1 # 90° clockwise
bind = $mainMod CTRL ALT, T, exec, hyprctl keyword monitor DP-1,2560x1440@165,0x0,1,transform,2 # 180° (upside down)
bind = $mainMod CTRL ALT SHIFT, T, exec, hyprctl keyword monitor DP-1,2560x1440@165,0x0,1,transform,3 # 270° (90° counter-clockwise)

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset


# F-key alternatives for common shortcuts
# F1 as alternative for Super + . (next workspace)
# bind = , F1, workspace, e+1 # Alternative to Super + .
# F2 as alternative for Super + M (toggle minimize)
# bind = , F2, exec, $UserScripts/ToggleMinimize.sh # Alternative to Super + M
# Shift + F2 as alternative for Shift + Super + M (move to current workspace)
bind = SHIFT, F2, movetoworkspace, e+0 # Alternative to Shift + Super + M

# F8 as media play key
bind = , F8, exec, playerctl play-pause

# F10 sequence keybinding (ydotool F11 + fullscreen)
bind = , F10, exec, $UserScripts/F10KeySequence.sh # F10 -> ydotool F11 -> fullscreen

# Screen capture keybinds (screenshots and recording)
source= $UserConfigs/ScreenCaptureKeybinds.conf

bind = $mainMod, X, exec, ~/.config/hypr/UserScripts/falar-toggle.sh
bind = $mainMod SHIFT, X, exec, PIPER_MODEL=en_US-lessac-high ~/.config/hypr/UserScripts/falar-toggle.sh

bind = $mainMod SHIFT, Z, exec, scrcpy --max-size 1280 --video-bit-rate 8M

# Toggle inactive transparency (swap opacity rules and reload)
bind = $mainMod ALT, T, exec, $UserScripts/toggle-inactive-opacity.sh

# Hyprscrolling layout toggle (ON/OFF)
# Mantém seu layout padrão como dwindle; ao desativar volta para dwindle.
bind = $mainMod ALT, H, exec, $scriptsDir/ToggleHyprscrolling.sh

# Mic virtual toggle (PipeWire loopback)
bind = $mainMod CTRL, M, exec, $UserScripts/mic-virtual-toggle.sh

# CPU Temperature Monitor toggle (sound alerts on temp changes)
bind = $mainMod ALT, F12, exec, $scriptsDir/cpu-temp-toggle.sh

# Hyprspace Plugin Keybindings
# Note: Plugin is enabled with: hyprpm enable Hyprspace
# bind = $mainMod, A, overview:toggle # Launch Hyprspace overview (Hyprspace plugin)
# bind = , F4, overview:toggle, all # Open Hyprspace on all monitors

# Virtual Display (headless output) toggle and window move
bind = $mainMod, F7, exec, $UserScripts/ToggleVirtualDisplay.sh # Toggle virtual display on/off
bind = $mainMod SHIFT, F7, exec, $UserScripts/MoveToVirtualDisplay.sh # Move window to virtual display
bind = $mainMod CTRL, F7, exec, $UserScripts/MoveToVirtualDisplay.sh --silent # Move window silently to virtual display

# Handy transcription toggle
bind = SHIFT, F12, exec, ~/.apps/Handy_0.7.6_amd64.AppImage --toggle-transcription
