# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 13
  gaps_out = 21
  
  # rgba(00000000)
  # col.active_border = $color12 
  col.active_border = rgba(800080FF)
  col.inactive_border = $color10
  # col.inactive_border = $color10
  resize_on_border = true
  extend_border_grab_area = 30
}

decoration {
  rounding = 15
         
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  # dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 5
    render_power = 1

    color = rgba(000000FF)
    color_inactive = rgba(00000000)
    # color =  $color12
    # color_inactive = $color10
  }


  blur {
    enabled = true	
    size = 6
    passes = 2
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}

# Window rule to remove borders from inactive windows
# windowrulev2 = noborder, focus:0
